[project]
name = "review-gateway"
version = "0.1.0"
description = "API Gateway: GitHub webhook + OAuth trigger front-end for the review-api engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "python-dotenv>=1.0,<2",
    # sqlite3 (stdlib) covers local dev; Postgres (in-cluster or RDS) needs
    # a real driver. binary build: no build toolchain needed in the image.
    "psycopg[binary]>=3.1,<4",
    # Fernet, to keep the AI service's API key encrypted in the database.
    "cryptography>=42,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
review-gateway = "review_gateway.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
